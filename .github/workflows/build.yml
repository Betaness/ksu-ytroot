name: build-apk
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: clone upstream (full history) and patch
        run: |
          git clone --filter=blob:none https://github.com/tiann/KernelSU.git ksu
          cd ksu
          echo -n "upstream commits: "; git rev-list --count HEAD
          D=manager/app/src/main/java/me/weishu/kernelsu/ui/screen/home
          cp ../HomeMiuix.kt $D/HomeMiuix.kt
          B=manager/build.gradle.kts
          sed -i 's/extra\["androidCompileSdkVersionMinor"\] = 0/extra["androidCompileSdkVersionMinor"] = 2/' $B
          grep -rl "val fullFeatured = Natives.isFullFeatured()" manager/app/src/main/java | while read f; do
            sed -i 's/val fullFeatured = Natives.isFullFeatured()/val fullFeatured = true/' "$f"; echo "patched $f"
          done
          grep -rc TempRootCard $D/HomeMiuix.kt
      - name: sdk
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses >/dev/null 2>&1 || true
          $SDKM "platforms;android-37.2" "build-tools;35.0.0" "ndk;29.0.14206865"
      - name: build
        run: |
          cd ksu/manager
          gradle assembleDebug --no-daemon -PKSU_NAME=YT-Root > /tmp/build.log 2>&1
          tail -6 /tmp/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: |
            /tmp/build.log
            ksu/manager/app/build/outputs/apk/debug/*.apk