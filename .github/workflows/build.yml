name: build-apk
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: prepare
        run: |
          python3 -c "import zipfile;z=zipfile.ZipFile('src.zip');z.extractall('.');print('extracted',len(z.namelist()))"
          rm -f local.properties
          ls gradle/wrapper
      - name: sdk
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses >/dev/null 2>&1 || true
          $SDKM "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: build
        run: |
          gradle assembleDebug --no-daemon >build.log 2>&1 || true
          tail -60 build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: |
            build.log
            app/build/outputs/apk/debug/*.apk