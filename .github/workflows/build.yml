name: build-apk
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: clone and patch
        run: |
          git clone --depth 1 https://github.com/tiann/KernelSU.git ksu
          D=ksu/manager/app/src/main/java/me/weishu/kernelsu/ui/screen/home
          cp HomeMiuix.kt $D/HomeMiuix.kt
          sed -i 's/extra\["androidCompileSdkVersionMinor"\] = 0/extra["androidCompileSdkVersionMinor"] = 2/' ksu/manager/build.gradle.kts
          G=ksu/manager/app/build.gradle.kts
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation("dev.rikka.shizuku:api:13.1.5")\n    implementation("dev.rikka.shizuku:provider:13.1.5")/' $G
          grep -n "shizuku" $G | head -3
          sed -i 's#</application>#        <provider android:name="rikka.shizuku.ShizukuProvider" android:authorities="${applicationId}.shizuku" android:multiprocess="false" android:enabled="true" android:exported="true" />\n    </application>#' ksu/manager/app/src/main/AndroidManifest.xml
          grep -n "ShizukuProvider" ksu/manager/app/src/main/AndroidManifest.xml | head -2
          grep -c TempRootCard $D/HomeMiuix.kt
      - name: sdk
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses >/dev/null 2>&1 || true
          $SDKM "platforms;android-37.2" "build-tools;35.0.0" "ndk;29.0.14206865"
      - name: build
        run: |
          cd ksu/manager
          gradle assembleDebug --no-daemon -PKSU_NAME=YT-Root > /tmp/build.log 2>&1
          tail -10 /tmp/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: |
            /tmp/build.log
            ksu/manager/app/build/outputs/apk/debug/*.apk