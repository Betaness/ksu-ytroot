name: build-apk
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: clone and patch
        run: |
          git clone --depth 1 https://github.com/tiann/KernelSU.git ksu
          cd ksu
          git apply --verbose ../ytroot.patch || patch -p1 < ../ytroot.patch
          sed -i 's/JavaVersion.VERSION_17/JavaVersion.VERSION_21/g' manager/build.gradle.kts
          sed -i 's/extra\["androidCompileSdkVersion"\] = 35/extra["androidCompileSdkVersion"] = 37/' manager/build.gradle.kts
          sed -i 's/extra\["androidCompileSdkVersionMinor"\] = 0/extra["androidCompileSdkVersionMinor"] = 2/' manager/build.gradle.kts
          sed -i 's/"27.2.12479018"/"29.0.14206865"/' manager/build.gradle.kts
          python3 - <<PYEOF
import re,io
p='manager/app/build.gradle.kts'
s=open(p).read()
s=s.replace('compileSdk = androidCompileSdkVersion',
'''compileSdk {
        version = release(androidCompileSdkVersion) {
            minorApiLevel = androidCompileSdkVersionMinor
        }
    }''')
open(p,'w').write(s)
print('compileSdk block restored')
PYEOF
          grep -n "CompileSdk\|NdkVersion" manager/build.gradle.kts | head
      - name: sdk
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses >/dev/null 2>&1 || true
          $SDKM --list 2>/dev/null | grep -E "platforms;android-37" | head -5
          $SDKM "platforms;android-37.2" "build-tools;35.0.0" "ndk;29.0.14206865"
      - name: build
        run: |
          cd ksu/manager
          gradle assembleDebug --no-daemon > /tmp/build.log 2>&1 || true
          tail -40 /tmp/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: |
            /tmp/build.log
            ksu/manager/app/build/outputs/apk/debug/*.apk